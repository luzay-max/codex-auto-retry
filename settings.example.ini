[Limits]
; Per-minute max across the last rolling 60 seconds. Range: 1..60
max_per_minute=2
; Minimum time between actual click-message attempts. Range: 1..600 seconds
cooldown_seconds=15
; Max click-message attempts in one script run. Range: 1..1000
max_per_session=20
; How often to scan the UI, not the click interval. Range: 1..60 seconds
scan_seconds=5